<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishora</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
      text-align: center;
    }

    header {
      padding: 45px 20px;
      background: #f8d9e8;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .tagline {
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 25px;
      background: #d96b9b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #f8d9e8;
    }
  </style>
</head>

<body>

  <header>
    <h1>Wishora ✨</h1>
    <p class="tagline">Make every wish a little more special.</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>💌 Personalized Wishes</h2>
      <p>Create beautiful messages for birthdays, celebrations and special moments.</p>
      <button onclick="alert('Coming soon!')">Create a Wish</button>
    </div>

    <div class="card">
      <h2>🎁 Special Messages</h2>
      <p>Choose a style, add your message and make someone's day memorable.</p>
      <button onclick="alert('Wishora is coming soon!')">Explore</button>
    </div>

  </div>

  <footer>
    © 2026 Wishora
  </footer>

</body>
</html>
