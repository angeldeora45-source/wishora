<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Greeting | Wishora</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Wishora 🌸</div>
    <a href="index.html" class="nav-btn">Home</a>
  </header>

  <main class="hero">

    <div class="hero-card">

      <span class="small-text">Make it personal 💌</span>

      <h1>Create Your <span>Greeting</span></h1>

      <p>
        Tell us a little about your teacher and choose the feeling
        you want your greeting to express.
      </p>

      <form id="greetingForm">

        <input
          type="text"
          id="teacherName"
          placeholder="Teacher's Name"
          required
        >

        <input
          type="text"
          id="studentName"
          placeholder="Your Name"
          required
        >

        <label class="upload-box">
          🖼️ Add a Photo
          <input type="file" id="photo" accept="image/*">
        </label>

        <select id="language">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
        </select>

        <select id="feeling">
          <option value="Thankful">🙏 Thankful</option>
          <option value="Emotional">❤️ Emotional</option>
          <option value="Respectful">🌹 Respectful</option>
          <option value="Inspirational">✨ Inspirational</option>
          <option value="Friendly">😊 Friendly</option>
          <option value="Funny">😄 Funny</option>
        </select>

        <button type="submit" class="main-btn">
          Generate Greeting ✨
        </button>

      </form>

    </div>

  </main>

  <footer>
    Made with ♡ by Wishora
  </footer>

  <script src="script.js"></script>

</body>
</html>
